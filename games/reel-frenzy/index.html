<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#06122e">
  <title>Reel Frenzy — arcade fishing</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='13' font-size='13'%3E%F0%9F%8E%A3%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="stage">
    <canvas id="game" width="960" height="720" aria-label="Reel Frenzy fishing game"></canvas>
    <div id="touch" aria-hidden="true">
      <button id="btn-left" class="tbtn" type="button">◀</button>
      <button id="btn-cast" class="tbtn tbtn--cast" type="button">CAST</button>
      <button id="btn-right" class="tbtn" type="button">▶</button>
    </div>
  </main>
  <p id="hint">SPACE cast &nbsp;·&nbsp; ← → steer &nbsp;·&nbsp; P pause &nbsp;·&nbsp; R restart</p>
  <script src="game.js"></script>
</body>
</html>
